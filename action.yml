name: RAMA Analysis
description: Analyze model and metamodel changes in a pull request and report results.

inputs:
  pull-request-number:
    description: Pull request number to analyze.
    required: true

runs:
  using: composite
  steps:

    - name: Clone RAMA
      shell: bash
      run: git clone https://github.com/munidiff/rama.git

    - name: Debug action path
      shell: bash
      run: |
        echo "github.action_path = ${{ github.action_path }}"
        echo "pom path          = ${{ github.action_path }}/pom.xml"
        if [[ -f "${{ github.action_path }}/pom.xml" ]]; then
          echo "pom.xml exists"
        else
          echo "pom.xml NOT found"
        fi
        ls -la "${{ github.action_path }}"

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: ${{ github.action_path }}/pom.xml

    - name: Install EMF Compare locally
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        mvn install:install-file \
          -Dfile=libs/org.eclipse.emf.compare_3.5.3.202406060900.jar \
          -DgroupId=org.eclipse.emf.compare \
          -DartifactId=org.eclipse.emf.compare \
          -Dversion=3.5.3 \
          -Dpackaging=jar

    - name: Install Modiff libs locally
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        mvn install:install-file \
          -Dfile=libs/org.eclipse.epsilon.modiff-0.0.1-SNAPSHOT.jar \
          -DpomFile=libs/org.eclipse.epsilon.modiff-0.0.1-SNAPSHOT.pom.xml

        mvn install:install-file \
          -Dfile=libs/org.eclipse.epsilon.modiff.emfcompare-0.0.1-SNAPSHOT.jar \
          -DpomFile=libs/org.eclipse.epsilon.modiff.emfcompare-0.0.1-SNAPSHOT.pom.xml

    - name: Build RAMA
      shell: bash
      working-directory: ${{ github.action_path }}
      run: mvn clean package

    - name: Run RAMA
      shell: bash
      working-directory: ${{ github.action_path }}
      run: java -jar target/RAMA.jar "${{ inputs.pull-request-number }}"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}